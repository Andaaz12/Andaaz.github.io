<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LIBAAS Admin</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#2b2622;--mut:#7a716a;--line:#e6dfd4;--wine:#6e1f2e;--ok:#3d7a5a;--err:#b23b3b;--r:10px;font-family:Inter,system-ui,Arial,sans-serif}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--ink);font-size:14px}button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}.hide{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login form{background:#fff;padding:34px;border-radius:14px;width:min(380px,100%);box-shadow:0 20px 60px #0002;display:grid;gap:12px}
.login h1{font-family:Georgia,serif;letter-spacing:.3em;color:var(--wine);text-align:center;font-size:26px}.login p{color:var(--mut);font-size:12px;line-height:1.5}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}textarea{min-height:70px}input:focus,select:focus,textarea:focus{outline:2px solid var(--wine);outline-offset:-1px}
.btn{padding:9px 16px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:#fff;font-weight:500}.btn.w{background:var(--wine);border-color:var(--wine)}.btn.g{background:#fff;color:var(--ink);border-color:var(--line)}.btn.d{background:#fff;color:var(--err);border-color:#e8c5c5}.btn.s{padding:5px 10px;font-size:12px}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#2b1519;color:#f3ede3;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
aside h2{font-family:Georgia,serif;letter-spacing:.3em;font-size:20px;padding:0 10px 18px}aside button{background:none;border:0;color:#d9c9c0;text-align:left;padding:11px 12px;border-radius:8px;display:flex;gap:10px}aside button:hover{background:#ffffff14}aside button.on{background:var(--wine);color:#fff}
.top{display:flex;gap:12px;align-items:center;padding:14px 28px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.top input{max-width:320px}.sp{flex:1}
.badge{font-size:11px;padding:4px 10px;border-radius:99px;background:#eef6f1;color:var(--ok)}.badge.un{background:#fff3df;color:#a8650c}
main{padding:28px;display:grid;gap:18px;align-content:start}h1.t{font-family:Georgia,serif;font-size:28px;font-weight:500}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}.card b{display:block;font-size:28px;font-family:Georgia,serif}.card span{color:var(--mut);font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);background:#faf8f4}td img{width:42px;height:54px;object-fit:cover;border-radius:5px;background:#eee}
.wrapx{overflow-x:auto}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f label{display:block;font-size:12px;color:var(--mut);margin:0 0 4px}.item{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.modalbg{position:fixed;inset:0;background:#0006;display:grid;place-items:center;z-index:50;padding:16px}.modal{background:#fff;border-radius:14px;width:min(720px,100%);max-height:92vh;overflow:auto;padding:24px;display:grid;gap:14px}
.sw{display:flex;align-items:center;gap:8px}.sw input{width:auto}ul.log{list-style:none;padding:0;display:grid;gap:8px}ul.log li{font-size:13px;color:var(--mut)}
iframe{border:1px solid var(--line);border-radius:12px;background:#fff;height:72vh;max-width:100%;margin:auto;display:block}
@media(max-width:800px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;overflow:auto}aside h2{display:none}.grid2{grid-template-columns:1fr}main{padding:16px}.top{padding:12px 16px}}
</style></head><body>
<div class="login" id="login"><form id="lf"><h1>LIBAAS</h1><p id="lp">Admin sign-in</p><input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button class="btn w">Sign in</button><p id="le" style="color:var(--err)"></p></form></div>
<div class="app hide" id="app"><aside id="nav"></aside><div><div class="top"><input id="q" placeholder="Search products…"><div class="sp"></div><span class="badge" id="st"></span><button class="btn g s" id="out">Log out</button></div><main id="main"></main></div></div>
<script>
const K={site:'libaas_site',draft:'libaas_draft',seed:'libaas_seed',log:'libaas_log',pw:'libaas_admin_pw'};
const $=s=>document.querySelector(s),ld=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},sv=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const SITEFILE='libaas-womenswear-v2.html';
async function hash(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('libaas|'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of 'libaas|'+s)h=(h*33^c.charCodeAt(0))>>>0;return'f'+h}}
let D,tab='dash',q='';
const base=()=>ld(K.site,null)||ld(K.seed,null);
const SECS=[['hero','Hero slider'],['categories','Shop by category'],['new','New arrivals grid'],['festive','Festive banner'],['bestsellers','Bestsellers'],['look','Shop the look'],['trending','Trending now'],['reviews','Reviews'],['faq','FAQ'],['instagram','Instagram grid']];
const TABS=[['dash','▦ Dashboard'],['prod','◉ Products'],['cats','▤ Categories'],['hero','▣ Hero banners'],['nav','☰ Navigation'],['look','✎ Appearance'],['prev','▷ Preview & publish'],['set','⚙ Settings']];
function log(m){const l=ld(K.log,[]);l.unshift({t:new Date().toLocaleString(),m});sv(K.log,l.slice(0,30))}
function touch(m){sv(K.draft,D);if(m)log(m);badge()}
const dirty=()=>JSON.stringify(D)!==JSON.stringify(ld(K.site,base()));
function badge(){const b=$('#st');b.textContent=dirty()?'● Unpublished changes':'✓ Live site up to date';b.className='badge'+(dirty()?' un':'')}
/* ---------- login (demo, no Firebase auth) ---------- */
const DEMO_EMAIL='mbshort000@gmail.com',DEMO_PASS='misbah11';
const FB_DB='https://libaas-a094a-default-rtdb.firebaseio.com';
const toArr=v=>Array.isArray(v)?v.filter(x=>x!=null):(v&&typeof v==='object'?Object.values(v):[]);
function normalize(d){d=d||{};d.products=toArr(d.products).map(p=>({...p,tags:toArr(p.tags),gallery:toArr(p.gallery),colors:toArr(p.colors).map(c=>toArr(c)).filter(c=>c.length),badge:p.badge||null,alt:p.alt||p.img||'',fabric:p.fabric||'',care:p.care||'',desc:p.desc||''}));d.products.forEach(p=>{if(!p.colors.length)p.colors=[['Default','#cccccc']]});d.cats=toArr(d.cats).map(c=>toArr(c));d.nav=toArr(d.nav).map(c=>toArr(c));d.hero=toArr(d.hero);d.hidden=toArr(d.hidden);d.theme=d.theme&&typeof d.theme==='object'?d.theme:{};d.ann=d.ann||'';return d}
async function fbGet(){const r=await fetch(FB_DB+'/site.json',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
async function fbPut(d){const r=await fetch(FB_DB+'/site.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});if(!r.ok)throw new Error('HTTP '+r.status)}
async function fbDel(){const r=await fetch(FB_DB+'/site.json',{method:'DELETE'});if(!r.ok)throw new Error('HTTP '+r.status)}
function boot(){$('#lp').textContent='Admin sign-in';if(sessionStorage.getItem('libaas_auth')==='1')enter()}
$('#lf').onsubmit=e=>{e.preventDefault();const em=$('#em').value.trim().toLowerCase(),p=$('#pw').value;
 if(em!==DEMO_EMAIL||p!==DEMO_PASS){$('#le').textContent='Wrong email or password.';return}
 sessionStorage.setItem('libaas_auth','1');enter()};
async function enter(){let live=null;$('#le').textContent='Loading…';try{live=await fbGet()}catch(e){console.warn('Firebase read failed',e)}$('#le').textContent='';if(live){live=normalize(live);sv(K.site,live)}const b=base();if(!b){$('#login').innerHTML='<form style="background:#fff;padding:30px;border-radius:14px;max-width:420px"><h1 style="font-family:Georgia;color:#6e1f2e">One step needed</h1><p style="margin-top:10px">Open <b>'+SITEFILE+'</b> once in this browser so the admin can read your real products and content, then reload this page.</p></form>';return}
 D=normalize(ld(K.draft,null)||JSON.parse(JSON.stringify(ld(K.site,b))));D.theme=D.theme||{};D.hidden=D.hidden||[];$('#login').classList.add('hide');$('#app').classList.remove('hide');draw()}
$('#out').onclick=()=>{sessionStorage.removeItem('libaas_auth');location.reload()};
$('#q').oninput=e=>{q=e.target.value.toLowerCase();tab='prod';draw()};
/* ---------- layout ---------- */
function draw(){$('#nav').innerHTML='<h2>LIBAAS</h2>'+TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" data-t="${k}">${l}</button>`).join('');badge();const m=$('#main');({dash,prod,cats:()=>lst('cats','Categories','The “Shop by Category” tiles on the homepage.',[[0,'Name'],[1,'Image URL','img']],()=>['New Category','']),hero:()=>lst('hero','Hero banners','Homepage slider. Each slide has its own text, button and photo.',[['label','Label'],['title','Title (HTML allowed, e.g. <em>word</em>)'],['text','Text'],['btn','Button text'],['filter','Button filter (All, Wedding, Festive…)'],['img','Image URL','img']],()=>({label:'New Collection',title:'New <em>Banner.</em>',text:'Describe it here.',btn:'Shop Now',filter:'All',img:''})),nav:()=>lst('nav','Navigation menu','Desktop and mobile menu share these links (use #new, #festive, #bestsellers or any URL).',[[0,'Label'],[1,'Link']],()=>['New Link','#new']),look,prev,set}[tab]||dash)(m)}
$('#nav').onclick=e=>{const b=e.target.closest('[data-t]');if(b){tab=b.dataset.t;draw()}};
const head=(t,s,btn='')=>`<div class="row"><div><h1 class="t">${t}</h1><p style="color:var(--mut)">${s}</p></div><div class="sp" style="flex:1"></div>${btn}</div>`;
function dash(m){const pr=D.products,l=ld(K.log,[]);m.innerHTML=head('Dashboard','Overview of your storefront')+`<div class="cards"><div class="card"><b>${pr.length}</b><span>Total products</span></div><div class="card"><b>${pr.filter(p=>!p.hidden).length}</b><span>Visible products</span></div><div class="card"><b>${D.cats.length}</b><span>Categories</span></div><div class="card"><b>${D.hero.length}</b><span>Hero banners</span></div><div class="card"><b>${SECS.length-D.hidden.length}/${SECS.length}</b><span>Sections shown</span></div></div>
<div class="card"><h3>Quick actions</h3><div class="row" style="margin-top:12px"><button class="btn w" data-go="prod" data-add>+ Add product</button><button class="btn g" data-go="hero">Edit banners</button><button class="btn g" data-go="look">Colours & sections</button><button class="btn g" data-go="prev">Preview & publish</button></div></div>
<div class="card"><h3>Recent changes</h3><ul class="log" style="margin-top:12px">${l.length?l.slice(0,8).map(x=>`<li><b style="color:var(--ink)">${esc(x.m)}</b> · ${esc(x.t)}</li>`).join(''):'<li>No changes yet.</li>'}</ul></div>`;
 m.onclick=e=>{const b=e.target.closest('[data-go]');if(b){tab=b.dataset.go;draw();if(b.hasAttribute('data-add'))pf()}}}
/* ---------- products ---------- */
function prod(m){const list=D.products.map((p,i)=>[p,i]).filter(([p])=>!q||(p.name+p.cat+(p.badge||'')).toLowerCase().includes(q));
 m.innerHTML=head('Products',D.products.length+' products · edit, hide, reorder or delete','<button class="btn w" id="addp">+ Add product</button>')+`<div class="wrapx"><table><tr><th></th><th>Name</th><th>Category</th><th>Price</th><th>Badge</th><th>Visible</th><th></th></tr>${list.map(([p,i])=>`<tr><td><img src="${esc(p.img)}" alt=""></td><td>${esc(p.name)}</td><td>${esc(p.cat)}</td><td>₹${p.price} <s style="color:var(--mut)">₹${p.mrp}</s></td><td>${esc(p.badge||'—')}</td><td><input type="checkbox" style="width:auto" data-vis="${i}" ${p.hidden?'':'checked'}></td><td class="row" style="flex-wrap:nowrap"><button class="btn g s" data-mv="${i}|-1">↑</button><button class="btn g s" data-mv="${i}|1">↓</button><button class="btn g s" data-ed="${i}">Edit</button><button class="btn d s" data-del="${i}">Delete</button></td></tr>`).join('')||'<tr><td colspan="7">No products found.</td></tr>'}</table></div>`;
 $('#addp').onclick=()=>pf();
 m.onclick=e=>{const t=e.target;if(t.dataset.ed!=null)pf(+t.dataset.ed);if(t.dataset.del!=null){const p=D.products[+t.dataset.del];if(confirm('Delete “'+p.name+'”? It will disappear from the website after you publish.')){D.products.splice(+t.dataset.del,1);touch('Deleted product '+p.name);draw()}}
  if(t.dataset.mv){const[a,d]=t.dataset.mv.split('|').map(Number),b=a+d;if(b>=0&&b<D.products.length){[D.products[a],D.products[b]]=[D.products[b],D.products[a]];touch('Reordered products');draw()}}
  if(t.dataset.vis!=null){const p=D.products[+t.dataset.vis];p.hidden=!t.checked;touch((p.hidden?'Hid ':'Showed ')+p.name)}}}
function pf(i){const n=i==null,p=n?{id:Math.max(0,...D.products.map(x=>x.id))+1,name:'',cat:D.cats[0]?D.cats[0][0]:'Kurta Sets',tags:['Casual'],price:999,mrp:1499,rating:4.5,count:0,badge:'New',colors:[['Ivory','#f1e9dc']],img:'',alt:'',gallery:[],fabric:'',care:'',desc:''}:{...D.products[i]};
 const f=(id,l,v,t='text')=>`<div class="f"><label>${l}</label><input id="${id}" type="${t}" value="${esc(v)}"></div>`;
 const bg=document.createElement('div');bg.className='modalbg';bg.innerHTML=`<div class="modal"><h2>${n?'Add product':'Edit product'}</h2><div class="grid2">${f('f_name','Name',p.name)}<div class="f"><label>Category</label><input id="f_cat" list="cl" value="${esc(p.cat)}"><datalist id="cl">${[...new Set(D.products.map(x=>x.cat))].map(c=>`<option>${esc(c)}`).join('')}</datalist></div>${f('f_price','Sale price (₹)',p.price,'number')}${f('f_mrp','MRP (₹)',p.mrp,'number')}${f('f_badge','Badge (New, Bestseller, blank for none)',p.badge||'')}${f('f_tags','Tags (comma separated)',p.tags.join(', '))}</div>
 ${f('f_img','Main image URL',p.img)}${f('f_alt','Hover image URL',p.alt)}<div class="f"><label>More gallery images (one URL per line)</label><textarea id="f_gal">${esc((p.gallery||[]).join('\n'))}</textarea></div>${f('f_col','Colours (Name:#hex, comma separated)',p.colors.map(c=>c[0]+':'+c[1]).join(', '))}${f('f_fab','Fabric',p.fabric)}${f('f_care','Care',p.care)}<div class="f"><label>Description</label><textarea id="f_desc">${esc(p.desc)}</textarea></div><label class="sw"><input type="checkbox" id="f_vis" ${p.hidden?'':'checked'}> Visible on website</label><p id="f_err" style="color:var(--err)"></p><div class="row"><button class="btn g" id="f_x">Cancel</button><div class="sp" style="flex:1"></div><button class="btn w" id="f_ok">Save product</button></div></div>`;document.body.appendChild(bg);
 $('#f_x').onclick=()=>bg.remove();$('#f_ok').onclick=()=>{const v=id=>$('#'+id).value.trim(),price=+v('f_price'),mrp=+v('f_mrp');if(!v('f_name')||!(price>0)||!v('f_img')){$('#f_err').textContent='Name, a price above 0 and a main image URL are required.';return}
  const o={...p,name:v('f_name'),cat:v('f_cat')||'Uncategorised',price,mrp:Math.max(mrp,price),badge:v('f_badge')||null,tags:v('f_tags').split(',').map(s=>s.trim()).filter(Boolean),img:v('f_img'),alt:v('f_alt')||v('f_img'),gallery:[v('f_img'),...$('#f_gal').value.split('\n').map(s=>s.trim()).filter(Boolean)],colors:v('f_col').split(',').map(s=>s.trim()).filter(Boolean).map(s=>{const[a,b]=s.split(':');return[a.trim(),(b||'#cccccc').trim()]}),fabric:v('f_fab'),care:v('f_care'),desc:$('#f_desc').value.trim(),hidden:!$('#f_vis').checked};if(!o.colors.length)o.colors=[['Default','#cccccc']];
  if(n)D.products.unshift(o);else D.products[i]=o;touch((n?'Added product ':'Edited product ')+o.name);bg.remove();draw()}}
/* ---------- generic list editor (categories, hero, nav) ---------- */
function lst(key,title,sub,fields,mk){const m=$('#main');m.innerHTML=head(title,sub,'<button class="btn w" id="addi">+ Add</button>')+D[key].map((it,i)=>`<div class="item"><div class="grid2">${fields.map(([k,l,ty])=>`<div class="f"><label>${l}</label><input data-l="${key}|${i}|${k}" value="${esc(it[k])}"></div>`).join('')}</div>${fields.some(f=>f[2]==='img')&&it[fields.find(f=>f[2]==='img')[0]]?`<img src="${esc(it[fields.find(f=>f[2]==='img')[0]])}" style="height:70px;border-radius:6px;object-fit:cover" alt="">`:''}<div class="row"><button class="btn g s" data-m="${key}|${i}|-1">↑ Up</button><button class="btn g s" data-m="${key}|${i}|1">↓ Down</button><button class="btn d s" data-x="${key}|${i}">Delete</button></div></div>`).join('')||'<div class="card">Nothing here yet.</div>';
 $('#addi').onclick=()=>{D[key].push(mk());touch('Added item to '+title);draw()};
 m.onchange=e=>{const t=e.target;if(t.dataset.l){const[k,i,f]=t.dataset.l.split('|');D[k][+i][f]=t.value;touch('Edited '+title)}};
 m.onclick=e=>{const t=e.target;if(t.dataset.x){const[k,i]=t.dataset.x.split('|');if(confirm('Delete this item? It disappears from the website after you publish.')){D[k].splice(+i,1);touch('Deleted item from '+title);draw()}}
  if(t.dataset.m){const[k,i,d]=t.dataset.m.split('|'),a=+i,b=a+ +d;if(b>=0&&b<D[k].length){[D[k][a],D[k][b]]=[D[k][b],D[k][a]];touch('Reordered '+title);draw()}}}}
/* ---------- appearance ---------- */
const FONTS=['Cormorant Garamond','Playfair Display','Lora','Jost','Inter','Poppins','DM Sans'];
const shade=(h,a)=>'#'+[1,3,5].map(i=>Math.round(parseInt(h.substr(i,2),16)*(1-a)).toString(16).padStart(2,'0')).join('');
function look(m){const t=D.theme,c=(k,l,d)=>`<div class="f"><label>${l}</label><input type="color" data-th="${k}" value="${t[k]||d}" style="height:42px;padding:3px"></div>`,s=(k,l,d)=>`<div class="f"><label>${l}</label><select data-th="${k}">${FONTS.map(f=>`<option ${f===(t[k]||d)?'selected':''}>${f}`).join('')}</select></div>`;
 m.innerHTML=head('Appearance','Colours, fonts, announcement bar and which sections are shown')+`<div class="card" style="display:grid;gap:14px"><div class="f"><label>Announcement bar text</label><input id="ann" value="${esc(D.ann)}"></div><div class="grid2">${c('wine','Brand colour','#6e1f2e')}${c('ivory','Page background','#faf7f2')}${c('char','Text colour','#2b2622')}${c('gold','Accent colour','#b9975b')}${s('fh','Heading font','Cormorant Garamond')}${s('fb','Body font','Jost')}<div class="f"><label>Button / card corner radius (px)</label><input type="number" min="0" max="30" data-th="r" value="${t.r??4}"></div></div><button class="btn g s" id="rt" style="width:max-content">Reset appearance to original</button></div>
 <div class="card"><h3>Website sections</h3><p style="color:var(--mut);margin:6px 0 12px">Untick a section to remove it from the homepage.</p><div class="grid2">${SECS.map(([id,l])=>`<label class="sw"><input type="checkbox" data-sec="${id}" ${D.hidden.includes(id)?'':'checked'}> ${l}</label>`).join('')}</div></div>`;
 m.onchange=e=>{const t2=e.target;if(t2.id==='ann'){D.ann=t2.value;touch('Edited announcement')}if(t2.dataset.th){const k=t2.dataset.th;t2.value===''?delete D.theme[k]:D.theme[k]=k==='r'?+t2.value:t2.value;if(k==='wine')D.theme['wine-d']=shade(t2.value,.25);touch('Changed appearance')}
  if(t2.dataset.sec){D.hidden=D.hidden.filter(x=>x!==t2.dataset.sec);if(!t2.checked)D.hidden.push(t2.dataset.sec);touch('Toggled section '+t2.dataset.sec)}};
 $('#rt').onclick=()=>{D.theme={};touch('Reset appearance');draw()}}
/* ---------- preview / publish ---------- */
function prev(m){m.innerHTML=head('Preview & publish','The preview shows your unpublished draft exactly as visitors would see it after publishing.')+`<div class="row"><button class="btn g s" data-w="1280">Desktop</button><button class="btn g s" data-w="820">Tablet</button><button class="btn g s" data-w="390">Mobile</button><div style="flex:1"></div><button class="btn d" id="dis">Discard changes</button><button class="btn w" id="pub">Publish changes</button></div><iframe id="fr" src="${SITEFILE}?preview=1" style="width:1280px"></iframe>`;
 m.onclick=e=>{const w=e.target.dataset.w;if(w)$('#fr').style.width=w+'px'};
 $('#pub').onclick=async()=>{const bt=$('#pub');bt.disabled=true;bt.textContent='Publishing…';try{await fbPut(D);sv(K.site,D);log('Published changes');badge();alert('Published to Firebase. Your website now shows these changes live.')}catch(e){alert('Could not publish to Firebase ('+e.message+'). Check your Realtime Database rules allow writes to /site.')}bt.disabled=false;bt.textContent='Publish changes'};
 $('#dis').onclick=()=>{if(confirm('Discard all unpublished changes?')){D=JSON.parse(JSON.stringify(ld(K.site,base())));D.theme=D.theme||{};D.hidden=D.hidden||[];sv(K.draft,D);log('Discarded draft');draw()}}}
/* ---------- settings ---------- */
function set(m){m.innerHTML=head('Settings','Account, backup and reset')+`<div class="card" style="display:grid;gap:8px"><h3>Signed in as</h3><p style="color:var(--mut)">${DEMO_EMAIL} (demo login)</p></div><div class="card" style="display:grid;gap:12px"><h3>Backup</h3><p style="color:var(--mut)">Export your published content as a JSON file, or import one. Importing replaces the draft.</p><div class="row"><button class="btn g" id="ex">Export JSON</button><input type="file" id="im" accept=".json" style="max-width:260px"></div></div><div class="card" style="display:grid;gap:12px"><h3>Reset</h3><p style="color:var(--mut)">Remove every admin change and go back to the original website content.</p><button class="btn d" id="rs" style="width:max-content">Reset website to original</button></div>`;
 $('#ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));a.download='libaas-site.json';a.click()};
 $('#im').onchange=e=>{const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.products)throw 0;D=j;D.theme=D.theme||{};D.hidden=D.hidden||[];touch('Imported JSON');alert('Imported into draft. Review it in Preview, then publish.')}catch(x){alert('That file is not a valid LIBAAS export.')}};r.readAsText(e.target.files[0])};
 $('#rs').onclick=async()=>{if(confirm('Reset everything to the original website content? This cannot be undone.')){try{await fbDel()}catch(e){alert('Could not clear Firebase ('+e.message+').')}[K.site,K.draft].forEach(k=>localStorage.removeItem(k));log('Reset to original');location.reload()}}}
boot();
</script></body></html>
